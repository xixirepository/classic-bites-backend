# Existing nginx container mounts:
# /home/xixi/certbot/www -> /var/www/certbot
# /home/xixi/certbot/conf -> /etc/letsencrypt
# Load the HTTPS server only after the certificate exists.
server {
    listen 80;
    server_name vpn.xixiplay.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # Never forward authentication requests over public HTTP.
    location / {
        return 308 https://vpn.xixiplay.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name vpn.xixiplay.com;

    ssl_certificate /etc/letsencrypt/live/vpn.xixiplay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.xixiplay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Resolve again after API recreation instead of retaining its former IP.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $classic_bites_upstream classic-bites-api:8000;

    # Allow multipart overhead; the API enforces its own 100 MiB file limit.
    client_max_body_size 110m;
    client_body_timeout 10s;

    location / {
        proxy_pass http://$classic_bites_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace client-supplied forwarding headers; trust only this proxy IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        # Refresh tokens rotate once; never retry a request at the proxy.
        proxy_next_upstream off;
        proxy_redirect off;
    }
}
